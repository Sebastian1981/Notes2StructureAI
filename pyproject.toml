[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "notes2structure"
version = "0.1.0"
description = "Turn handwritten notes and sketches into validated structured artifacts."
readme = "README.md"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
dependencies = [
  "openai==3.14.1",
  "pillow==12.1.0",
  "pydantic==2.12.5",
]

[project.scripts]
notes2structure = "notes2structure.cli:main"

[dependency-groups]
dev = [
  "pre-commit==4.5.1",
  "pyright==1.1.408",
  "pytest==9.0.2",
  "ruff==0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notes2structure"]

[tool.hatch.build]
include = [
  "src/notes2structure/**/*.py",
  "src/notes2structure/prompts/*.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "FBT001",
  "PERF401",
  "TC001",
  "TC003",
  "TRY300",
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
